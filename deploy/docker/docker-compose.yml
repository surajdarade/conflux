services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conflux
    ports: ["5432:5432"]
    volumes:
      - conflux-postgres:/var/lib/postgresql/data
      - ../../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conflux"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - conflux-redis:/data

  identity:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        PROJECT: src/Services/Identity/Conflux.Identity/Conflux.Identity.csproj
        APP_DLL: Conflux.Identity.dll
    environment:
      ConnectionStrings__IdentityDatabase: Host=postgres;Port=5432;Database=conflux_identity;Username=postgres;Password=postgres
      Database__ApplyMigrations: "true"
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      postgres: { condition: service_healthy }

  catalog:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        PROJECT: src/Services/Catalog/Conflux.Catalog/Conflux.Catalog.csproj
        APP_DLL: Conflux.Catalog.dll
    environment:
      ConnectionStrings__CatalogDatabase: Host=postgres;Port=5432;Database=conflux_catalog;Username=postgres;Password=postgres
      Database__ApplyMigrations: "true"
      Redis__Enabled: "true"
      ConnectionStrings__Redis: redis:6379
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  inventory:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        PROJECT: src/Services/Inventory/Conflux.Inventory/Conflux.Inventory.csproj
        APP_DLL: Conflux.Inventory.dll
    environment:
      ConnectionStrings__InventoryDatabase: Host=postgres;Port=5432;Database=conflux_inventory;Username=postgres;Password=postgres
      Database__ApplyMigrations: "true"
      InventorySharding__Enabled: "true"
      InventorySharding__VirtualNodesPerShard: "256"
      InventorySharding__Shards__0__Name: inventory-0
      InventorySharding__Shards__0__ConnectionString: Host=postgres;Port=5432;Database=conflux_inventory_shard_0;Username=postgres;Password=postgres
      InventorySharding__Shards__1__Name: inventory-1
      InventorySharding__Shards__1__ConnectionString: Host=postgres;Port=5432;Database=conflux_inventory_shard_1;Username=postgres;Password=postgres
      InventorySharding__Shards__2__Name: inventory-2
      InventorySharding__Shards__2__ConnectionString: Host=postgres;Port=5432;Database=conflux_inventory_shard_2;Username=postgres;Password=postgres
      InventorySharding__Shards__3__Name: inventory-3
      InventorySharding__Shards__3__ConnectionString: Host=postgres;Port=5432;Database=conflux_inventory_shard_3;Username=postgres;Password=postgres
      ASPNETCORE_URLS: http://+:8080
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: http://+:8081
      Kestrel__Endpoints__Grpc__Protocols: Http2
    expose:
      - "8081"
    depends_on:
      postgres: { condition: service_healthy }

  order:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        PROJECT: src/Services/Order/Conflux.Order/Conflux.Order.csproj
        APP_DLL: Conflux.Order.dll
    environment:
      ConnectionStrings__OrderDatabase: Host=postgres;Port=5432;Database=conflux_order;Username=postgres;Password=postgres
      ConnectionStrings__InventoryGrpc: http://inventory:8081
      Services__Inventory__GrpcAddress: http://inventory:8081
      Services__Payment__BaseAddress: http://payment:8080
      Database__ApplyMigrations: "true"
      CheckoutSaga__Enabled: "true"
      CheckoutSaga__BootstrapServers: kafka:9092
      KafkaRetry__BootstrapServers: kafka:9092
      KafkaRetry__SourceTopics__0: conflux.order.events
      KafkaRetry__SourceTopics__1: conflux.payment.events
      KafkaRetry__ConsumerGroup: conflux-order-checkout-retry-v1
      KafkaRetry__MaxAttempts: "3"
      KafkaRetry__AutomaticDlqRecovery: "true"
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      inventory: { condition: service_started }
      payment: { condition: service_started }

  payment:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        PROJECT: src/Services/Payment/Conflux.Payment/Conflux.Payment.csproj
        APP_DLL: Conflux.Payment.dll
    environment:
      ConnectionStrings__PaymentDatabase: Host=postgres;Port=5432;Database=conflux_payment;Username=postgres;Password=postgres
      Database__ApplyMigrations: "true"
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      postgres: { condition: service_healthy }

  fulfillment:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        PROJECT: src/Services/Fulfillment/Conflux.Fulfillment/Conflux.Fulfillment.csproj
        APP_DLL: Conflux.Fulfillment.dll
    environment:
      ConnectionStrings__FulfillmentDatabase: Host=postgres;Port=5432;Database=conflux_fulfillment;Username=postgres;Password=postgres
      Database__ApplyMigrations: "true"
      Kafka__BootstrapServers: kafka:9092
      KafkaRetry__BootstrapServers: kafka:9092
      KafkaRetry__SourceTopics__0: conflux.order.events
      KafkaRetry__ConsumerGroup: conflux-fulfillment-retry-v1
      KafkaRetry__MaxAttempts: "3"
      KafkaRetry__AutomaticDlqRecovery: "true"
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      order-outbox: { condition: service_started }

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        PROJECT: src/Gateway/Conflux.Gateway/Conflux.Gateway.csproj
        APP_DLL: Conflux.Gateway.dll
    volumes:
      - ./appsettings.gateway.json:/app/appsettings.Production.json:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    ports: ["8080:8080"]
    depends_on:
      - identity
      - catalog
      - inventory
      - order
      - payment
      - fulfillment

  catalog-outbox:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
      args:
        PROJECT: src/Workers/CatalogOutbox/Conflux.Catalog.OutboxPublisher/Conflux.Catalog.OutboxPublisher.csproj
        APP_DLL: Conflux.Catalog.OutboxPublisher.dll
    environment:
      ConnectionStrings__CatalogDatabase: Host=postgres;Port=5432;Database=conflux_catalog;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:9092
      KafkaRetry__BootstrapServers: kafka:9092
      KafkaRetry__SourceTopics__0: conflux.catalog.events
      KafkaRetry__ConsumerGroup: conflux-catalog-projection-retry-v1
      KafkaRetry__MaxAttempts: "3"
      KafkaRetry__AutomaticDlqRecovery: "true"
    depends_on:
      - postgres
      - kafka

  catalog-projection:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
      args:
        PROJECT: src/Workers/CatalogProjection/Conflux.Catalog.ProjectionWorker/Conflux.Catalog.ProjectionWorker.csproj
        APP_DLL: Conflux.Catalog.ProjectionWorker.dll
    environment:
      ConnectionStrings__CatalogDatabase: Host=postgres;Port=5432;Database=conflux_catalog;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:9092
      KafkaRetry__BootstrapServers: kafka:9092
      KafkaRetry__SourceTopics__0: conflux.catalog.events
      KafkaRetry__ConsumerGroup: conflux-catalog-projection-retry-v1
      KafkaRetry__MaxAttempts: "3"
      KafkaRetry__AutomaticDlqRecovery: "true"
    depends_on:
      - postgres
      - kafka

  inventory-outbox:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
      args:
        PROJECT: src/Workers/InventoryOutbox/Conflux.Inventory.OutboxPublisher/Conflux.Inventory.OutboxPublisher.csproj
        APP_DLL: Conflux.Inventory.OutboxPublisher.dll
    environment:
      ConnectionStrings__InventoryDatabase: Host=postgres;Port=5432;Database=conflux_inventory;Username=postgres;Password=postgres
      InventorySharding__Enabled: "true"
      InventorySharding__VirtualNodesPerShard: "256"
      InventorySharding__Shards__0__Name: inventory-0
      InventorySharding__Shards__0__ConnectionString: Host=postgres;Port=5432;Database=conflux_inventory_shard_0;Username=postgres;Password=postgres
      InventorySharding__Shards__1__Name: inventory-1
      InventorySharding__Shards__1__ConnectionString: Host=postgres;Port=5432;Database=conflux_inventory_shard_1;Username=postgres;Password=postgres
      InventorySharding__Shards__2__Name: inventory-2
      InventorySharding__Shards__2__ConnectionString: Host=postgres;Port=5432;Database=conflux_inventory_shard_2;Username=postgres;Password=postgres
      InventorySharding__Shards__3__Name: inventory-3
      InventorySharding__Shards__3__ConnectionString: Host=postgres;Port=5432;Database=conflux_inventory_shard_3;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      - postgres
      - kafka

  order-outbox:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
      args:
        PROJECT: src/Workers/OrderOutbox/Conflux.Order.OutboxPublisher/Conflux.Order.OutboxPublisher.csproj
        APP_DLL: Conflux.Order.OutboxPublisher.dll
    environment:
      ConnectionStrings__OrderDatabase: Host=postgres;Port=5432;Database=conflux_order;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      - postgres
      - kafka

  payment-outbox:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
      args:
        PROJECT: src/Workers/PaymentOutbox/Conflux.Payment.OutboxPublisher/Conflux.Payment.OutboxPublisher.csproj
        APP_DLL: Conflux.Payment.OutboxPublisher.dll
    environment:
      ConnectionStrings__PaymentDatabase: Host=postgres;Port=5432;Database=conflux_payment;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      - postgres
      - kafka


  toxiproxy:
    image: shopify/toxiproxy:2.12.0
    ports:
      - "8474:8474"
      - "15432:15432"
      - "19092:19092"

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on:
      - gateway
      - identity
      - catalog
      - inventory
      - order
      - payment
      - fulfillment

  grafana:
    image: grafana/grafana:12.2.0
    ports: ["3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/conflux-dashboard.json:/var/lib/grafana/dashboards/conflux-dashboard.json:ro
    depends_on:
      - prometheus

volumes:
  conflux-postgres:
  conflux-redis:
