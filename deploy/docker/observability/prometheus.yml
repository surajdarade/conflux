global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs: [{ targets: ["gateway:8080"] }]
  - job_name: identity
    metrics_path: /metrics
    static_configs: [{ targets: ["identity:8080"] }]
  - job_name: catalog
    metrics_path: /metrics
    static_configs: [{ targets: ["catalog:8080"] }]
  - job_name: inventory
    metrics_path: /metrics
    static_configs: [{ targets: ["inventory:8080"] }]
  - job_name: order
    metrics_path: /metrics
    static_configs: [{ targets: ["order:8080"] }]
  - job_name: payment
    metrics_path: /metrics
    static_configs: [{ targets: ["payment:8080"] }]
  - job_name: fulfillment
    metrics_path: /metrics
    static_configs: [{ targets: ["fulfillment:8080"] }]
