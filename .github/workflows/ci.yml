
name: Conflux CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate Docker Compose
        run: docker compose -f deploy/docker/docker-compose.yml config -q

      - name: Restore
        run: dotnet restore Conflux.slnx

      - name: Build
        run: dotnet build Conflux.slnx -c Release --no-restore

      - name: Start infrastructure
        run: |
          docker compose -f deploy/docker/docker-compose.yml \
            up -d postgres kafka redis

      - name: Start application stack
        run: |
          docker compose -f deploy/docker/docker-compose.yml \
            up -d --build gateway

      - name: Check application containers
        run: |
          docker compose -f deploy/docker/docker-compose.yml ps

      - name: Wait for Gateway
        run: |
          echo "Waiting for Conflux Gateway on port 8080..."

          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null \
              --max-time 3 http://localhost:8080/; then
              echo "Gateway is accepting HTTP connections."
              exit 0
            fi

            echo "Gateway not ready. Attempt $attempt/60"
            sleep 5
          done

          echo "Gateway did not become available."

          docker compose -f deploy/docker/docker-compose.yml ps
          docker compose -f deploy/docker/docker-compose.yml logs \
            --tail=100 gateway identity catalog inventory order payment fulfillment

          exit 1

      - name: Full-stack E2E checkout smoke
        run: bash ./scripts/e2e-checkout-smoke.sh

      - name: Hot-SKU correctness stress
        run: |
          CONFLUX_HOT_SKU_REQUESTS=10000 \
          CONFLUX_HOT_SKU_CONCURRENCY=256 \
          bash ./scripts/run-hot-sku.sh

      - name: Test
        run: |
          dotnet test Conflux.slnx \
            -c Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx"

      - name: Package vulnerability audit
        run: |
          dotnet list Conflux.slnx package \
            --vulnerable \
            --include-transitive

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: ignore

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker/docker-compose.yml ps
          docker compose -f deploy/docker/docker-compose.yml logs \
            --tail=150

      - name: Shutdown infrastructure
        if: always()
        run: |
          docker compose -f deploy/docker/docker-compose.yml down -v
